{% extends "base.html" %}
{% block content %}
<div class="auth-container">
    <form class="auth-form" method="post">
        <h2><i data-lucide="activity"></i> OA Detect AI</h2>
        <p style="color:#64748b; margin-top:-5px; margin-bottom:15px;">{{ 'Welcome Back' if mode=='login' else 'Create your account' }}</p>
        
        {% if err %}<div style="color:#ef4444; font-size:0.9rem; background:#fee2e2; padding:10px; border-radius:4px;">{{err}}</div>{% endif %}
        
        {% if mode == 'signup' %}
        <input type="text" name="name" placeholder="Full Name" required>
        {% endif %}
        <input type="email" name="email" placeholder="Email Address" required>
        <input type="password" name="password" placeholder="Password" required>
        
        <button class="btn" type="submit" style="margin-top:10px;">{{ 'Log In' if mode=='login' else 'Sign Up' }}</button>
        <div style="text-align: center; margin-top:15px;">
            <a href="{{ url_for('signup' if mode=='login' else 'login') }}" style="color:var(--primary); text-decoration:none; font-size:0.9rem; font-weight:500;">
                {{ 'Need an account? Sign up' if mode=='login' else 'Have an account? Log in' }}
            </a>
        </div>
    </form>
</div>
{% endblock %}
